services:
  db:
    image: postgres:16-alpine
    container_name: helpflow-db
    restart: always
    environment:
      POSTGRES_DB: helpflow_tickets
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d helpflow_tickets"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  technician-dispatch-service:
    build:
      context: ./technician-dispatch-service
      dockerfile: Dockerfile
    container_name: technician-dispatch-service
    restart: always
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  support-ticket-service:
    build:
      context: ./support-ticket-service
      dockerfile: Dockerfile
    container_name: support-ticket-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/helpflow_tickets
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      DISPATCH_SERVICE_URL: http://technician-dispatch-service:8081
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    depends_on:
      db:
        condition: service_healthy
      technician-dispatch-service:
        condition: service_healthy

volumes:
  postgres_data:
